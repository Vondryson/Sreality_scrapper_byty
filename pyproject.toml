[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sreality-chaty-tracker"
version = "0.1.0"
description = "Private market tracker for cottages and chalets listed on Sreality.cz"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "backend/tests", "scripts"]
extend-exclude = ["old version", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "backend/src"
files = ["backend/src", "scripts"]

[tool.coverage.run]
branch = true
source = ["backend/src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
